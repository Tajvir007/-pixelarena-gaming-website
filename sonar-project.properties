# Unique project identifier in SonarQube
sonar.projectKey=devops-task-management

# Project display name
sonar.projectName=DevOps Task Management Platform

# Source code directory
sonar.sources=backend/src

# Test code directory
sonar.tests=backend/tests

# Test file patterns
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Exclude dependencies and generated files
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**

# Encoding
sonar.sourceEncoding=UTF-8