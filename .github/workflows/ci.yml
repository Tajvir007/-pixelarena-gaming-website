# ============================================================
# PixelArena CI: Test -> Trivy FS Scan -> Docker Build -> Trivy Image Scan -> Push
# ============================================================

name: PixelArena CI + Docker + Trivy

# ------------------------------------------------------------
# Triggers
# ------------------------------------------------------------
on:
  # Run when code is pushed to main
  push:
    branches: [main]

  # Run for pull requests targeting main (tests + scans only, no push)
  pull_request:
    branches: [main]

  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:

# ------------------------------------------------------------
# Permissions
# Least privilege: the workflow only needs to read the repo code
# ------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------
# Concurrency
# If a new commit is pushed to the same branch/PR,
# cancel the older run that is still in progress
# ------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Job 1: Application tests
  # ==========================================================
  application-test:
    name: Application Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js and cache npm dependencies for faster runs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install exact versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Run the automated tests
      - name: Run tests
        run: npm test


  # ==========================================================
  # Job 2: Trivy filesystem scan
  # Scans source code for vulnerable dependencies, secrets
  # and misconfigurations
  # ==========================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    needs: application-test          # Runs only if tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs                       # Scan the file system
          scan-ref: .                         # Scan the whole repository
          scanners: vuln,secret,misconfig     # What to look for
          severity: HIGH,CRITICAL             # Only report serious issues
          ignore-unfixed: true                # Skip issues with no available fix
          format: table                       # Readable output in logs
          exit-code: '1'                      # Fail the job if issues are found


  # ==========================================================
  # Job 3: Build, scan and publish the Docker image
  # ==========================================================
  docker:
    name: Docker Build, Scan and Push
    needs: trivy-filesystem          # Runs only if the filesystem scan passes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Local image name used for build + scan
      LOCAL_IMAGE: pixelarena-gaming-website
      # Full Docker Hub repository name
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pixelarena-gaming-website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the image locally, tagged with the commit SHA
      - name: Build Docker image
        run: docker build -t "$LOCAL_IMAGE:${{ github.sha }}" .

      # Scan the exact image that was just built
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pixelarena-gaming-website:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library               # OS packages + app libraries
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'                      # Block the push if scan fails

      # Log in to Docker Hub ONLY on pushes to main (never for pull requests)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and push the image (runs only after the scan has passed)
      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Tag with the commit SHA (unique, traceable version)
          docker tag "$LOCAL_IMAGE:${{ github.sha }}" "$DOCKERHUB_IMAGE:${{ github.sha }}"

          # Tag as latest (always points to the newest main build)
          docker tag "$LOCAL_IMAGE:${{ github.sha }}" "$DOCKERHUB_IMAGE:latest"

          # Push both tags
          docker push "$DOCKERHUB_IMAGE:${{ github.sha }}"
          docker push "$DOCKERHUB_IMAGE:latest"