# PixelArena CI + Docker Hub


# ============================================================
# Workflow Configuration
# ============================================================

# Workflow name
name: PixelArena CI + Docker + Trivy


# ============================================================
# Workflow Triggers
# ============================================================

# Workflow কখন run করবে
on:

  # main branch-এ code push হলে
  push:
    branches:
      - main

  # main branch-এর জন্য Pull Request তৈরি হলে
  pull_request:
    branches:
      - main

# Workflow-এর permission নির্ধারণ
permissions:
  # GitHub repository-এর code checkout করার অনুমতি
  contents: read

  # GitHub OIDC token request করার অনুমতি
  id-token: write


# ============================================================
# Environment Variables
# ============================================================

env:

  # Docker Hub repository name
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/pixelarena-gaming-website


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # Job 1 — Application Test
  # ==========================================================

  application-test:

    # GitHub-hosted Ubuntu runner ব্যবহার করবে
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Step 1 — Checkout Repository
      # --------------------------------------------------------

      # GitHub repository-এর source code runner-এ নিয়ে আসবে
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Step 2 — Setup Node.js
      # --------------------------------------------------------

      # Node.js environment setup করবে
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:

          # Node.js version
          node-version: 18

          # npm dependency caching enable করবে
          cache: npm


      # --------------------------------------------------------
      # Step 3 — Install Dependencies
      # --------------------------------------------------------

      # package-lock.json অনুযায়ী dependencies install করবে
      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Step 4 — Run Tests
      # --------------------------------------------------------

      # Application-এর automated tests run করবে
      - name: Run tests
        run: npm test

  # ==========================================================
  # Job 2: Trivy filesystem security scan
  # ==========================================================
  trivy-filesystem:
    name: Trivy Filesystem Scan
    needs: application-test
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Scan dependencies, secrets and supported configurations
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'


  # ==========================================================
  # Job 3 — Docker Build & Push
  # ==========================================================

  docker:

    name: Docker Build, Scan and Push
    # Application test সফল হলে এই job run করবে
    needs: trivy-filesystem

    # GitHub-hosted Ubuntu runner ব্যবহার করবে
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Step 1 — Checkout Repository
      # --------------------------------------------------------

      # -----------------------------------------------------
      # Step 2 — GitHub repository-এর source code runner-এ নিয়ে আসবে
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build image locally on the GitHub runner
      - name: Build Docker image
        run: |
          docker build \
            -t pixelarena-gaming-website:${{ github.sha }} \
            .


      # -----------------------------------------------------
      # Step 3 — Login to Docker Hub
      # -----------------------------------------------------

      # Scan the exact image built in the previous step
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pixelarena-gaming-website:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # Docker Hub-এ login করবে
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:

          # Docker Hub username GitHub Secret থেকে নেবে
          username: ${{ secrets.DOCKERHUB_USERNAME }}

          # Docker Hub Access Token GitHub Secret থেকে নেবে
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # Step 3 — Setup Docker Buildx
      # --------------------------------------------------------

      # Docker Buildx setup করবে
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # --------------------------------------------------------
      # Step 4 — Build and Push Docker Image
      # --------------------------------------------------------

      # Docker image build করে Docker Hub-এ push করবে
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:

          # Current project directory-কে build context হিসেবে ব্যবহার করবে
          context: .

          # Dockerfile-এর location
          file: ./Dockerfile

          # Build শেষে Docker Hub-এ image push করবে
          push: true

          # Docker image tags
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
